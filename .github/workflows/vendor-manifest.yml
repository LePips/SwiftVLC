# Guards the vendored libvlc binary against silent per-slice drift.
#
# Every complete Vendor/libvlc.xcframework inventory has a content-addressed
# checked-in manifest set under scripts/libvlc-manifests/sets/. A rebuilt
# libvlc.a that drops or gains plugins/objects in one slice —
# e.g. the tvOS slice intentionally lacks the Chromecast plugin stack,
# and a careless rebuild could reintroduce it (or strip a plugin a
# platform relies on) — passes compilation and most tests unnoticed.
# Diffing the member lists catches that drift at PR time, whenever the
# pinned binary (Package.swift) or the manifests themselves change.
name: Vendor manifest

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - Package.swift
      - scripts/libvlc-manifests/**
      - scripts/check-libvlc-manifest.sh
      - scripts/libvlc-manifest-set.py
      - scripts/validate_libvlc_feature_contract.py
      - scripts/tests/test_libvlc_feature_contract.py
      - scripts/tests/test_libvlc_manifest_set.py
      - .github/workflows/vendor-manifest.yml
  push:
    branches: [main]
    paths:
      - Package.swift
      - scripts/libvlc-manifests/**
      - scripts/check-libvlc-manifest.sh
      - scripts/libvlc-manifest-set.py
      - scripts/validate_libvlc_feature_contract.py
      - scripts/tests/test_libvlc_feature_contract.py
      - scripts/tests/test_libvlc_manifest_set.py
      - .github/workflows/vendor-manifest.yml

permissions:
  contents: read

concurrency:
  group: vendor-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # setup-dev.sh resolves the package with Xcode's built-in SwiftPM,
    # which must understand the manifest's Swift 6.3 tools-version —
    # needs Xcode 26.4+, hence macos-26 (same rationale as test.yml).
    runs-on: macos-26
    # GitHub hides draft releases from read-only installation tokens. The
    # resolver below separately authenticates and binds the exact candidate.
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        timeout-minutes: 2
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        timeout-minutes: 5
        with:
          xcode-version: "26.4"

      # The libvlc xcframework dominates the artifact cache.
      - name: Cache libvlc xcframework
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 5
        with:
          path: Vendor
          key: libvlc-xcf-vendor-v2-${{ hashFiles('Package.swift') }}
          enableCrossOsArchive: false

      # Download the exact released libvlc xcframework declared by Package.swift
      # into Vendor/. setup-dev.sh verifies the tag and GitHub asset digest.
      - name: Set up Vendor + local Swift package
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-candidates/')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-candidates/'))) && secrets.GITHUB_TOKEN || '' }}
          SWIFTVLC_ALLOW_DRAFT_RELEASE: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-candidates/')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-candidates/'))) && '1' || '' }}
        run: ./scripts/setup-dev.sh

      - name: Check libvlc archive-member manifests
        timeout-minutes: 5
        run: |
          python3 -m unittest \
            scripts/tests/test_libvlc_feature_contract.py \
            scripts/tests/test_libvlc_manifest_set.py
          ./scripts/check-libvlc-manifest.sh
